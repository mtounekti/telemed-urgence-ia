# GitHub Actions CI/CD
name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:

  # job 1: Linting & Tests
  test:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements-ci.txt

      - name: Download spaCy model
        run: python -m spacy download fr_core_news_sm

      - name: Lint with flake8
        run: |
          # Erreurs critiques uniquement (syntaxe)
          flake8 src/ --count --select=E9,F63,F7,F82 --show-source --statistics
          # Warnings (non bloquants)
          flake8 src/ --count --max-line-length=120 --statistics --exit-zero

      - name: Run tests
        run: pytest tests/ -v --tb=short -m "not slow"

  # job 2: Build, test & Push Docker image vers GHCR
  docker:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: test  # lance seulement si les tests passent

    permissions:
      contents: read
      packages: write   # nécessaire pour pousser vers GHCR

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: docker build -t ghcr.io/${{ github.repository }}:${{ github.sha }} .

      - name: Smoke test container
        run: |
          # Lance le container en arrière-plan
          docker run -d -p 8000:8000 \
            --name telemed-test \
            ghcr.io/${{ github.repository }}:${{ github.sha }}

          # on attends que l'API démarre
          sleep 15
          docker logs telemed-test

          # Vérifie que /health répond
          curl --fail http://localhost:8000/health
          docker stop telemed-test

      - name: Push Docker image to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag ghcr.io/${{ github.repository }}:${{ github.sha }} ghcr.io/${{ github.repository }}:latest
          docker push ghcr.io/${{ github.repository }}:${{ github.sha }}
          docker push ghcr.io/${{ github.repository }}:latest